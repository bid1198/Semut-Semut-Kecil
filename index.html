<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semut-semut Kecil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

        :root {
            --latar: #171513;
            --teks: #e5ded4;
            --teks-redup: #91877c;
            --aksen: #b9a58f;
            --font-narasi: 'Cormorant Garamond', serif;
            --font-ui: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 50% 40%, rgba(255,255,255,0.02), transparent 50%),
                var(--latar);
            color: var(--teks);
            font-family: var(--font-narasi);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Grain texture */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
            z-index: 1;
        }

        /* Vignette */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.4) 100%);
            z-index: 1;
        }

        .kontainer-muka {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: muncul 2s ease-out forwards;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ilustrasi semut - dibuat dengan CSS */
        .ilustrasi-semut {
            width: 120px;
            height: 120px;
            margin: 0 auto 3rem;
            position: relative;
            opacity: .6;
            animation: napas 4s ease-in-out infinite;
        }

        @keyframes napas {
            0%, 100% { transform: scale(1); opacity: .5; }
            50% { transform: scale(1.05); opacity: .7; }
        }

        .ilustrasi-semut svg {
            width: 100%;
            height: 100%;
        }

        .judul {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 500;
            letter-spacing: .02em;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .subjudul {
            font-family: var(--font-ui);
            font-size: .75rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--teks-redup);
            margin-bottom: 3rem;
            opacity: .7;
        }

        .deskripsi {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--teks-redup);
            margin-bottom: 4rem;
            font-style: italic;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .tombol-mulai {
            display: inline-block;
            padding: 1rem 3rem;
            border: 1px solid var(--aksen);
            color: var(--teks);
            text-decoration: none;
            font-family: var(--font-ui);
            font-size: .7rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            transition: all .4s ease;
            position: relative;
            overflow: hidden;
            min-height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tombol-mulai::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--aksen);
            transition: left .4s ease;
            opacity: .1;
        }

        .tombol-mulai:hover,
        .tombol-mulai:focus-visible {
            letter-spacing: .25em;
            border-color: var(--teks);
            outline: none;
        }

        .tombol-mulai:hover::before,
        .tombol-mulai:focus-visible::before {
            left: 0;
        }

        /* Semut kecil yang berjalan di halaman muka */
        .semut-berjalan {
            position: fixed;
            bottom: 50px;
            right: 50px;
            width: 5px;
            height: 3px;
            background: var(--teks);
            border-radius: 50%;
            opacity: .2;
            pointer-events: none;
            z-index: 2;
            animation: jalan-semut 30s linear infinite;
        }

        @keyframes jalan-semut {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-100px, -10px); }
            50% { transform: translate(-200px, 5px); }
            75% { transform: translate(-100px, -5px); }
            100% { transform: translate(0, 0); }
        }

        /* Responsif */
        @media (max-width: 600px) {
            .kontainer-muka {
                padding: 1rem;
            }
            
            .ilustrasi-semut {
                width: 80px;
                height: 80px;
                margin-bottom: 2rem;
            }
            
            .deskripsi {
                font-size: 1rem;
                margin-bottom: 3rem;
            }
            
            .semut-berjalan {
                bottom: 30px;
                right: 30px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="semut-berjalan" aria-hidden="true"></div>
    
    <main class="kontainer-muka">
        <div class="ilustrasi-semut" aria-hidden="true">
            <!-- Ilustrasi semut sederhana dengan SVG -->
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Badan -->
                <ellipse cx="50" cy="55" rx="12" ry="18" fill="none" stroke="#b9a58f" stroke-width="1.5"/>
                <ellipse cx="50" cy="35" rx="8" ry="10" fill="none" stroke="#b9a58f" stroke-width="1.5"/>
                <circle cx="50" cy="22" r="6" fill="none" stroke="#b9a58f" stroke-width="1.5"/>
                
                <!-- Antena -->
                <path d="M45 18 Q40 10 35 8" stroke="#b9a58f" stroke-width="1" fill="none"/>
                <path d="M55 18 Q60 10 65 8" stroke="#b9a58f" stroke-width="1" fill="none"/>
                
                <!-- Kaki -->
                <line x1="42" y1="45" x2="30" y2="50" stroke="#b9a58f" stroke-width="1"/>
                <line x1="58" y1="45" x2="70" y2="50" stroke="#b9a58f" stroke-width="1"/>
                <line x1="42" y1="55" x2="30" y2="60" stroke="#b9a58f" stroke-width="1"/>
                <line x1="58" y1="55" x2="70" y2="60" stroke="#b9a58f" stroke-width="1"/>
                <line x1="45" y1="65" x2="38" y2="72" stroke="#b9a58f" stroke-width="1"/>
                <line x1="55" y1="65" x2="62" y2="72" stroke="#b9a58f" stroke-width="1"/>
                
                <!-- Titik-titik kecil di sekitar -->
                <circle cx="20" cy="30" r="1" fill="#b9a58f" opacity=".3"/>
                <circle cx="80" cy="70" r="1" fill="#b9a58f" opacity=".3"/>
                <circle cx="75" cy="20" r="1" fill="#b9a58f" opacity=".2"/>
                <circle cx="25" cy="75" r="1" fill="#b9a58f" opacity=".2"/>
            </svg>
        </div>

        <h1 class="judul">Semut-semut Kecil</h1>
        
        <p class="subjudul">Bangkit I. Darojad</p>
        
        <p class="deskripsi">
            "Kukira retakan dinding,<br>
            rupanya semut-semut itu berbaris di sana."
        </p>

        <a href="https://bid1198.github.io/SemutSemutKecil/" class="tombol-mulai" aria-label="Mulai">
            Mulai
        </a>
    </main>
</body>
</html>
